<style>
:root{
  --bg:#f0f5ec;--surface:#fff;--surface-dim:#e8efe2;
  --primary:#1a4a3a;--primary-mid:#2d6a56;--primary-light:#3d8a6e;
  --accent:#e67e22;--accent-glow:rgba(230,126,34,.12);--accent-shadow:rgba(230,126,34,.3);
  --correct:#27ae60;--correct-light:#d4edda;
  --wrong:#e74c3c;--wrong-light:#fde2df;
  --amber:#f39c12;
  --text:#1a4a3a;--muted:#6b8f7a;--light:#a3c4b0;
  --border:#c8dcc0;
  --cell:36px;--radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 80px 0;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* ---- Header ---- */
.header{
  width:100%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;position:sticky;top:0;z-index:50;
}
.header-title{font-size:1.1rem;font-weight:800;letter-spacing:.08em}
.header-title span{color:var(--accent);font-weight:400}
.header-right{display:flex;align-items:center;gap:12px}
.progress-pill{
  font-size:.75rem;background:rgba(255,255,255,.15);
  padding:4px 10px;border-radius:20px;font-weight:600;
}
.btn-icon{
  background:none;border:none;color:#fff;font-size:1.3rem;
  cursor:pointer;padding:4px;opacity:.85;transition:opacity .2s;
}
.btn-icon:hover{opacity:1}

/* ---- Settings ---- */
.settings-panel{
  width:100%;max-width:520px;background:var(--surface);
  border-bottom:2px solid var(--border);
  padding:0;max-height:0;overflow:hidden;transition:all .3s ease;
}
.settings-panel.open{max-height:200px;padding:16px 20px}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.settings-row:last-child{border:none}
.settings-label{font-size:.88rem;color:var(--muted)}
.btn-sm{
  font-size:.8rem;padding:6px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;font-weight:600;transition:all .2s;
}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.danger{color:var(--wrong);border-color:var(--wrong)}

/* ---- Dashboard ---- */
.dashboard{
  display:grid;grid-template-columns:1fr 1fr 1fr auto;
  gap:6px;width:100%;max-width:520px;
  padding:14px 16px;background:var(--surface);
  margin:12px 16px 0;border-radius:var(--radius);
  box-shadow:0 2px 12px rgba(26,74,58,.06);
}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat-label{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.stat-val{font-size:1.2rem;font-weight:800;margin-top:2px}
.stat-val.new{color:var(--amber)}
.stat-val.hard{color:var(--wrong)}
.stat-val.mastered{color:var(--correct)}
.timer{
  font-size:1.3rem;font-weight:800;color:var(--primary);
  justify-self:end;align-self:center;min-width:52px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.timer.warn{color:var(--wrong);animation:pulse-warn 1s infinite}

/* ---- Progress bar ---- */
.progress-bar-wrap{width:100%;max-width:520px;padding:0 16px;margin-top:10px}
.progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--correct),var(--primary-light));
  border-radius:3px;transition:width .5s ease;
}
.progress-text{font-size:.65rem;color:var(--light);margin-top:3px;text-align:right}

/* ---- Game ---- */
.game-wrap{
  width:100%;max-width:520px;padding:0 16px;margin-top:14px;
  display:flex;flex-direction:column;align-items:center;
}
.page-nav{
  width:100%;display:flex;align-items:center;justify-content:center;
  gap:8px;margin-bottom:10px;
}
.page-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--border);transition:all .2s;
}
.page-dot.done{background:var(--correct)}
.page-dot.active{background:var(--accent);width:20px;border-radius:4px}
.page-dot.wrong{background:var(--wrong)}
.grid-box{
  display:inline-grid;gap:2px;background:var(--primary);
  padding:5px;border-radius:var(--radius-sm);
  box-shadow:0 6px 24px rgba(26,74,58,.12);
  user-select:none;
}
.cell{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);border-radius:2px;
}
.cell.black{background:var(--primary)}
.cell.hl{background:#fef3e2!important}
.cell-num{
  position:absolute;top:1px;left:2px;
  color:var(--accent);font-weight:800;
  pointer-events:none;line-height:1;z-index:5;
}
.cell input{
  width:100%;height:100%;border:none;text-align:center;
  background:transparent;font-family:inherit;
  font-weight:700;color:var(--primary);
  outline:none;caret-color:transparent;cursor:pointer;padding:0;border-radius:0;
}
.cell input:focus{background:transparent}
.cell input:disabled{opacity:.6;cursor:default}
.cell.correct-flash input{color:var(--correct)}
.cell.wrong-flash input{color:var(--wrong)}

/* Clues - single column for paginated layout */
.clues{
  width:100%;background:var(--surface);margin-top:12px;
  padding:12px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.clue{
  display:flex;align-items:center;gap:8px;
  margin-bottom:6px;font-size:.92rem;line-height:1.4;
  cursor:pointer;padding:4px 6px;
  border-radius:4px;transition:background .15s;
}
.clue:last-child{margin-bottom:0}
.clue:hover{background:var(--accent-glow)}
.clue-n{
  background:var(--primary);color:#fff;min-width:22px;height:22px;
  text-align:center;line-height:22px;border-radius:6px;
  font-size:.75rem;font-weight:700;flex-shrink:0;
}
.clue-dir{font-size:.65rem;color:var(--muted);margin-left:-4px}
.clue-cn{color:var(--text)}

/* Submit */
.btn-submit{
  width:100%;max-width:300px;padding:16px;margin-top:14px;
  background:var(--accent);color:#fff;border:none;
  font-size:1.05rem;font-weight:800;border-radius:50px;
  cursor:pointer;letter-spacing:.04em;
  box-shadow:0 4px 16px var(--accent-shadow);transition:all .15s;
}
.btn-submit:active{transform:scale(.96)}
.btn-skip{
  background:none;border:none;color:var(--muted);
  font-size:.82rem;font-weight:600;cursor:pointer;
  margin-top:6px;padding:6px 12px;text-decoration:underline;
}

/* ---- Result overlay ---- */
.result-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(240,245,236,.96);z-index:200;
  flex-direction:column;align-items:center;justify-content:center;
  padding:20px;animation:fade-in .25s;
}
.result-card{
  background:var(--surface);padding:32px 24px;border-radius:20px;
  text-align:center;max-width:380px;width:100%;
  box-shadow:0 12px 40px rgba(26,74,58,.1);animation:slide-up .3s ease;
}
.result-icon{font-size:3rem;margin-bottom:8px}
.result-title{font-size:1.4rem;font-weight:800;margin-bottom:12px}
.result-stats{display:flex;justify-content:center;gap:24px;margin-bottom:16px}
.result-stat{text-align:center}
.result-stat-val{font-size:1.5rem;font-weight:800}
.result-stat-label{font-size:.7rem;color:var(--muted);margin-top:2px}
.result-wrong-list{
  text-align:left;background:var(--wrong-light);border-radius:var(--radius-sm);
  padding:12px 14px;margin:12px 0;font-size:.85rem;line-height:1.6;
}
.result-wrong-list span{color:var(--wrong);font-weight:700}

/* ---- Review modal ---- */
.review-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:var(--bg);z-index:300;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
.review-card{
  background:var(--surface);padding:32px 24px;border-radius:20px;
  text-align:center;max-width:380px;width:100%;
  box-shadow:0 12px 40px rgba(26,74,58,.1);border:1px solid var(--border);
}
.review-round{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:4px}
.review-badge{
  display:inline-block;background:var(--accent-glow);color:var(--accent);
  font-size:.75rem;padding:3px 10px;border-radius:20px;
  font-weight:700;margin-bottom:16px;
}
.review-cn{font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:20px}
.review-input{
  width:100%;padding:14px;font-size:1.4rem;font-weight:700;
  border:2.5px solid var(--border);border-radius:var(--radius);
  text-align:center;color:var(--primary);background:var(--surface);
  outline:none;transition:border-color .2s;
}
.review-input:focus{border-color:var(--accent)}
.review-fb{min-height:28px;margin:12px 0;font-size:1rem;font-weight:700}
.btn-confirm{
  width:100%;padding:16px;background:var(--primary);color:#fff;
  border:none;font-size:1rem;font-weight:700;border-radius:50px;
  cursor:pointer;transition:all .15s;
}
.btn-confirm:active{transform:scale(.96)}

/* ---- Feedback FAB ---- */
.fab-feedback{
  position:fixed;bottom:20px;right:20px;z-index:100;
  background:var(--surface);color:var(--muted);
  border:1.5px solid var(--border);padding:8px 14px;
  border-radius:20px;font-size:.75rem;font-weight:600;
  cursor:pointer;text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .2s;
}
.fab-feedback:hover{color:var(--accent);border-color:var(--accent)}

/* ---- Animations ---- */
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes slide-up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse-warn{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* ---- Responsive ---- */
@media(max-width:380px){.clue{font-size:.82rem}}
@media(min-width:520px){}
</style>

// ======================== SM-2 算法 ========================
function sm2CalcInterval(rep,curInt,ef){
  if(rep<=0)return 1;if(rep===1)return 1;if(rep===2)return 6;
  return Math.max(1,Math.round(curInt*ef));
}
function sm2OnCorrect(obj){
  obj.repetitions=(obj.repetitions||0)+1;
  obj.interval=sm2CalcInterval(obj.repetitions,obj.interval||1,obj.easeFactor||2.5);
  obj.nextReview=Date.now()+obj.interval*864e5;
}
function sm2OnWrong(obj){
  obj.repetitions=0;obj.interval=1;
  obj.easeFactor=Math.max(1.3,(obj.easeFactor||2.5)-0.2);
}

// ======================== DATA MANAGEMENT ========================
// 修复清单#5：去重
function deduplicate(list){
  const seen=new Set();
  return list.filter(item=>{const k=item.w.toLowerCase().trim();if(seen.has(k))return false;seen.add(k);return true});
}
// 修复清单#1-4：增量修复，永不clear
function ensureSm2Fields(item){
  return{...item,w:item.w,c:item.c,weight:item.weight||0,interval:item.interval||1,
    repetitions:item.repetitions||0,easeFactor:item.easeFactor||2.5,nextReview:item.nextReview||0,
    sessionsSinceSeen:item.sessionsSinceSeen||0};
}
function migrateFromV48(){
  const ow=localStorage.getItem('wp_trial_v741:pet_wrong_final');
  const oc=localStorage.getItem('wp_trial_v741:pet_correct_final');
  if(!ow&&!oc)return false;
  try{
    let wrong=ow?JSON.parse(ow).map(ensureSm2Fields):[];
    let correct=oc?JSON.parse(oc).map(ensureSm2Fields):[];
    // 修复清单#4：增量合并新词（大小写不敏感）
    FULL_DB.forEach(db=>{
      const k=db.w.toLowerCase();
      if(!wrong.some(x=>x.w.toLowerCase()===k)&&!correct.some(x=>x.w.toLowerCase()===k))
        wrong.push({w:db.w,c:db.c,weight:0,interval:1,repetitions:0,easeFactor:2.5,nextReview:0});
    });
    // 修复清单#3：回源补全中文
    const fixC=list=>list.map(item=>{
      const orig=FULL_DB.find(x=>x.w.toLowerCase()===item.w.toLowerCase());
      if(orig&&!item.c)item.c=orig.c;return item;
    });
    wrong=fixC(wrong);correct=fixC(correct);
    // 修复清单#5：去重
    wrong=deduplicate(wrong);correct=deduplicate(correct);
    localStorage.setItem('wp_trial_v741:wp_wrong',JSON.stringify(wrong));
    localStorage.setItem('wp_trial_v741:wp_correct',JSON.stringify(correct));
    localStorage.setItem('wp_trial_v741:wp_version','mvp-v1');
    return true;
  }catch(e){console.error('迁移失败',e);return false}
}
function saveData(){
  try{
    if(resetIncomplete||!storageIsCurrent())return false;
    const tagged=items=>JSON.stringify(items.map(item=>({...item,_wpResetGeneration:storageGeneration})));
    localStorage.setItem('wp_trial_v741:wp_wrong',tagged(poolWrong));
    localStorage.setItem('wp_trial_v741:wp_correct',tagged(poolCorrect));
    localStorage.setItem('wp_trial_v741:wp_version','mvp-v1');
    return true;
  }catch(e){
    const status=document.getElementById('save-status');
    if(status)status.textContent='保存失败，请先导出记录并保留此页面';
    return false;
  }
}
function loadData(){
  if(!storageIsCurrent())return;
  if(storageGeneration==='initial'&&!localStorage.getItem('wp_trial_v741:wp_version')){
    migrateFromV48();
  }
  let w=localStorage.getItem('wp_trial_v741:wp_wrong'),c=localStorage.getItem('wp_trial_v741:wp_correct');
  const readCurrent=value=>value?JSON.parse(value).filter(item=>storageGeneration==='initial'||item._wpResetGeneration===storageGeneration).map(ensureSm2Fields):[];
  poolWrong=readCurrent(w);
  poolCorrect=readCurrent(c);
  // 修复清单#4：合并缺失词
  FULL_DB.forEach(db=>{
    const k=db.w.toLowerCase();
    if(!poolWrong.some(x=>x.w.toLowerCase()===k)&&!poolCorrect.some(x=>x.w.toLowerCase()===k))
      poolWrong.push({w:db.w,c:db.c,weight:0,interval:1,repetitions:0,easeFactor:2.5,nextReview:0});
  });
  // 修复清单#3：补全中文
  const fixC=list=>list.map(item=>{
    const orig=FULL_DB.find(x=>x.w.toLowerCase()===item.w.toLowerCase());
    if(orig&&(!item.c||item.c==='undefined'))item.c=orig.c;return item;
  });
  poolWrong=fixC(poolWrong);poolCorrect=fixC(poolCorrect);
  // 修复清单#5：去重
  poolWrong=deduplicate(poolWrong);poolCorrect=deduplicate(poolCorrect);
  saveData();
}
function exportData(){
  downloadLearningJSON(buildLearningExport(),`wordpuzzle-${new Date().toISOString().slice(0,10)}.json`);
}
function resetData(){openResetDialog();}
function toggleSettings(){document.getElementById('settings').classList.toggle('open')}

// ======================== UI ========================
function updateDashboard(){
  const nw=poolWrong.filter(x=>x.weight===0).length;
  const hw=poolWrong.filter(x=>x.weight>0).length;
  const mc=poolCorrect.length;
  document.getElementById('s-new').textContent=nw;
  document.getElementById('s-hard').textContent=hw;
  document.getElementById('s-master').textContent=mc;
  const total=nw+hw+mc,pct=total?Math.round(mc/total*100):0;
  document.getElementById('progress-pill').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=`已掌握 ${mc} / ${total} 词`;
  saveData();
}

// ======================== WORD SELECTION (v6②：错误池每次出现 + 防埋没) ========================
// 优先级：强制轮转(冷落>G局的难词) → 到期复习 → 其余难词(按分数) → 新词补足
function selectWords(){
  const now=Date.now(),size=10,selected=[],used=new Set();
  const add=(items,limit=size)=>{let n=0;for(const w of items){if(selected.length>=size||n>=limit)break;const key=w.w.toLowerCase();if(!used.has(key)){selected.push(w);used.add(key);n++;}}};
  const hard=poolWrong.filter(w=>w.weight>0).sort((a,b)=>(b.sessionsSinceSeen||0)-(a.sessionsSinceSeen||0)||(b.weight||0)-(a.weight||0));
  const due=poolCorrect.filter(w=>w.nextReview&&w.nextReview<=now).sort((a,b)=>a.nextReview-b.nextReview);
  const recentFailures=hard.filter(w=>w.lastFailedAt&&now-w.lastFailedAt<3*864e5).length;
  const dueQuota=Math.min(8,Math.max(2,Math.ceil(due.length/2)));
  // Unfinished words have first claim; overdue review gets a dynamic share.
  add([...poolWrong,...poolCorrect].filter(w=>w.priorityNext));
  add(hard.filter(w=>(w.sessionsSinceSeen||0)>=3),2);
  add(due,Math.max(2,dueQuota-(recentFailures>=4?2:0)));
  add(hard);
  const fresh=poolWrong.filter(w=>!w.weight).sort(()=>Math.random()-.5);
  add(fresh);add(due);
  // Never force a not-yet-due word into a round merely to fill ten slots.
  return selected;
}

// ======================== GRID GENERATION ========================
// v6③：合法填字生成——要求至少1交叉、校验相邻冲突、放不下即丢弃（不再随机乱放），多次重试取最优
function generateGrid(words){
  if(words.length<=1){generateIslands(words);return;}
  let maxLen=Math.max(...words.map(w=>w.w.length));
  const S=Math.max(11,maxLen+2); // 网格随最长词自适应，容纳publictransport等超长拼接词，防越界
  let best=null;
  let sorted=[...words].sort((a,b)=>b.w.length-a.w.length);
  const ATTEMPTS=Math.max(10,words.length*2);
  for(let attempt=0;attempt<ATTEMPTS;attempt++){
    let grid=Array(S).fill(null).map(()=>Array(S).fill(null));
    let placed=[];
    // 轮换种子词（不只翻方向），显著提高放置率
    let first=sorted[attempt%sorted.length];
    let list=[first,...sorted.filter(x=>x!==first)];
    let sd=(Math.floor(attempt/sorted.length)%2===0)?'across':'down';
    let r,c;
    if(sd==='across'){r=Math.floor(S/2);c=Math.floor((S-first.w.length)/2);}
    else{r=Math.floor((S-first.w.length)/2);c=Math.floor(S/2);}
    placeWord(grid,first,r,c,sd,1);
    placed.push({...first,num:1,row:r,col:c,dir:sd});
    let num=2;
    for(let i=1;i<list.length;i++){
      let w=list[i],cand=[];
      for(let p of placed){
        for(let ci=0;ci<w.w.length;ci++){
          for(let ti=0;ti<p.w.length;ti++){
            if(p.w[ti].toLowerCase()!==w.w[ci].toLowerCase())continue;
            let nd=p.dir==='across'?'down':'across';
            let nr=p.dir==='across'?(p.row-ci):(p.row+ti);
            let nc=p.dir==='across'?(p.col+ti):(p.col-ci);
            let res=canPlace(grid,w.w,nr,nc,nd);
            if(res.ok){
              let ctr=(S-1)/2;
              let midr=nd==='across'?nr:nr+(w.w.length-1)/2;
              let midc=nd==='across'?nc+(w.w.length-1)/2:nc;
              let dist=Math.abs(midr-ctr)+Math.abs(midc-ctr);
              cand.push({nr,nc,nd,s:res.crosses*10-dist});
            }
          }
        }
      }
      if(cand.length){
        cand.sort((a,b)=>b.s-a.s);let b=cand[0];
        placeWord(grid,w,b.nr,b.nc,b.nd,num);
        let assigned=grid[b.nr][b.nc].num;
        placed.push({...w,num:assigned,row:b.nr,col:b.nc,dir:b.nd});
        if(assigned===num)num++;
      }
    }
    if(!best||placed.length>best.placed.length)best={grid,placed,S};
    if(best.placed.length===words.length)break;
  }
  if(best.placed.length!==words.length){generateIslands(words);return;}
  placedWords=best.placed;
  renderBoard(best.grid,best.S);
}
function inBounds(S,r,c){return r>=0&&c>=0&&r<S&&c<S;}
// 返回 {ok, crosses}：校验越界、字母冲突、首尾粘连、平行贴边
function canPlace(grid,word,row,col,dir){
  const S=grid.length,len=word.length,across=dir==='across';
  if(!inBounds(S,row,col))return{ok:false};
  if(across){if(col+len>S)return{ok:false};}else{if(row+len>S)return{ok:false};}
  // 首尾外扩一格必须为空（防止和相邻词首尾连成一串）
  const bR=across?row:row-1,bC=across?col-1:col;
  const aR=across?row:row+len,aC=across?col+len:col;
  if(inBounds(S,bR,bC)&&grid[bR][bC])return{ok:false};
  if(inBounds(S,aR,aC)&&grid[aR][aC])return{ok:false};
  let crosses=0;
  for(let i=0;i<len;i++){
    const cr=across?row:row+i,cc=across?col+i:col;
    const cell=grid[cr][cc];
    if(cell){
      if(cell.char.toLowerCase()!==word[i].toLowerCase())return{ok:false};
      crosses++;
    }else{
      // 非交叉格：两侧垂直邻格必须为空（防止两个平行词贴边）
      const s1r=across?cr-1:cr,s1c=across?cc:cc-1;
      const s2r=across?cr+1:cr,s2c=across?cc:cc+1;
      if(inBounds(S,s1r,s1c)&&grid[s1r][s1c])return{ok:false};
      if(inBounds(S,s2r,s2c)&&grid[s2r][s2c])return{ok:false};
    }
  }
  return crosses>0?{ok:true,crosses}:{ok:false};
}
function placeWord(grid,wObj,row,col,dir,num){
  for(let i=0;i<wObj.w.length;i++){
    let r=dir==='across'?row:row+i,c=dir==='across'?col+i:col;
    let ex=grid[r][c]||{char:wObj.w[i],num:null,inAcross:false,inDown:false};
    if(dir==='across')ex.inAcross=true;if(dir==='down')ex.inDown=true;
    if(i===0&&!ex.num)ex.num=num;grid[r][c]=ex;
  }
}

// ======================== RENDERING ========================
function renderBoard(grid,S){
  const box=document.getElementById('grid');
  islandMode=false;lastGridSize=S;box.classList.remove('islands');
  box.innerHTML='';
  // 动态计算格子大小，确保网格适配屏幕
  const availW=Math.min(window.innerWidth-42,500);
  const cellSize=Math.min(42,Math.floor((availW-(S-1)*2-10)/S));
  const fontSize=Math.max(14,Math.floor(cellSize*0.48));
  const numSize=Math.max(8,Math.floor(cellSize*0.28));
  box.style.gridTemplateColumns=`repeat(${S},${cellSize}px)`;
  for(let r=0;r<S;r++){
    for(let c=0;c<S;c++){
      let d=grid[r][c],div=document.createElement('div');
      div.className=d?'cell':'cell black';
      if(d){
        div.style.width=cellSize+'px';div.style.height=cellSize+'px';
        div.dataset.r=r;div.dataset.c=c;div.dataset.ha=!!d.inAcross;div.dataset.hd=!!d.inDown;
        if(d.num)div.innerHTML=`<span class="cell-num" style="font-size:${numSize}px">${d.num}</span>`;
        let inp=document.createElement('input');inp.maxLength=1;inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.setAttribute('autocorrect','off');inp.spellcheck=false;inp.setAttribute('aria-label',`第${r+1}行第${c+1}格`);
        inp.style.fontSize=fontSize+'px';
        inp.onclick=e=>handleCellClick(e,r,c,d);
        inp.onfocus=()=>updateDirection(r,c,d);
        inp.onkeydown=e=>handleKey(e,r,c);
        inp.oninput=e=>handleInput(e,r,c);
        div.appendChild(inp);
      }else{
        div.style.width=cellSize+'px';div.style.height=cellSize+'px';
      }
      box.appendChild(div);
    }
  }
  renderClues();inputDirection='across';
}
function renderClues(){
  const el=document.getElementById('clues');el.innerHTML='';
  placedWords.sort((a,b)=>a.num-b.num).forEach(w=>{
    let d=document.createElement('div');d.className='clue';
    let arrow=w.dir==='across'?'→':'↓';
    d.innerHTML=`<span class="clue-n">${w.num}</span><span class="clue-dir">${arrow}</span><span class="clue-cn">${w.c}</span>`;
    d.onclick=()=>focusWord(w.num,w.dir);el.appendChild(d);
  });
}
function focusWord(num,dir){
  let pw=placedWords.find(w=>w.num===num&&w.dir===dir)||placedWords.find(w=>w.num===num);
  if(!pw)return;inputDirection=pw.dir;
  let div=document.querySelector(`div[data-r="${pw.row}"][data-c="${pw.col}"]`);
  if(div){let inp=div.querySelector('input');if(inp)inp.focus();}
  highlightWord(pw.row,pw.col);
}

// ======================== INTERACTION ========================
function updateDirection(r,c,d){
  if(d.inAcross&&!d.inDown)inputDirection='across';
  else if(!d.inAcross&&d.inDown)inputDirection='down';
  highlightWord(r,c);
}
function handleCellClick(e,r,c,d){
  if(d.inAcross&&d.inDown&&e.detail===2)inputDirection=inputDirection==='across'?'down':'across';
  updateDirection(r,c,d);
}
function highlightWord(r,c){
  document.querySelectorAll('.cell.hl').forEach(el=>el.classList.remove('hl'));
  let dr=inputDirection==='down'?1:0,dc=inputDirection==='across'?1:0;
  let cr=r,cc=c;
  while(true){
    let pr=cr-dr,pc=cc-dc;
    let pd=document.querySelector(`div[data-r="${pr}"][data-c="${pc}"]`);
    if(!pd)break;
    if(inputDirection==='across'&&pd.dataset.ha!=='true')break;
    if(inputDirection==='down'&&pd.dataset.hd!=='true')break;
    cr=pr;cc=pc;
  }
  while(true){
    let div=document.querySelector(`div[data-r="${cr}"][data-c="${cc}"]`);
    if(!div)break;
    let ok=inputDirection==='across'?div.dataset.ha==='true':div.dataset.hd==='true';
    if(!ok)break;div.classList.add('hl');cr+=dr;cc+=dc;
  }
}
function handleKey(e,r,c){
  if(e.key==='Tab')return;
  if(e.key.match(/^[a-zA-Z-]$/)){e.preventDefault();e.target.value=e.key;moveFocus(r,c,1);saveSession();return;}
  if(e.key==='Backspace'){e.preventDefault();if(e.target.value)e.target.value='';else moveFocus(r,c,-1);}
}
function handleInput(e,r,c){
  if(/^[a-zA-Z-]$/.test(e.target.value)){moveFocus(r,c,1);}
}
function moveFocus(r,c,step){
  let dr=inputDirection==='down'?1:0,dc=inputDirection==='across'?1:0;
  let nr=r+dr*step,nc=c+dc*step;
  let nd=document.querySelector(`div[data-r="${nr}"][data-c="${nc}"]`);
  if(nd&&!nd.classList.contains('black')&&(inputDirection==='across'?nd.dataset.ha==='true':nd.dataset.hd==='true')){let inp=nd.querySelector('input');if(inp)inp.focus();}
}

// V7.1 records elapsed practice time without a forced timeout.
function fmt(s){return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;}
